# Release iOS framework link needs more heap than 2g on CI runners.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4g"
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin/Native release link cache: release links take an order of magnitude
# longer than debug; reuse cached release artifacts across CI builds.
kotlin.native.binary.enableReleaseBinaryCache=true
kotlin.internal.native.enableReleaseBinaryCache=true

kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true

# iOS-only build; AndroidX flags removed with the Android target.
# ComposeApp is a static framework; moko copies .bundle via Xcode post-build phase.
moko.resources.disableStaticFrameworkWarning=true

# Kotlin/Native incremental compilation (persistent konan cache on CI).
kotlin.native.incremental=true

# Do NOT set org.gradle.java.home here — it breaks CI (path is machine-local).
# Local Mac: export JAVA_HOME=... or set org.gradle.java.home in ~/.gradle/gradle.properties
